name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck
      - name: Validate manifest
        run: jq -e '.schemaVersion == 1 and .id == "io.github.ivankuznetsov.hive-status"' manifest.json
      - name: Lint shell scripts
        run: shellcheck scripts/hive-status tests/run tests/fakes/*
      - name: Run integration tests
        run: tests/run
